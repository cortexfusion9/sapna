<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>StartHub SOP Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

  <header class="bg-black text-white p-4 text-lg font-semibold">
    🧠 StartHub SOP Agent – Live Demo
  </header>

  <main id="chat" class="flex-1 overflow-y-auto p-4 space-y-3"></main>

  <footer class="p-4 bg-white flex gap-2">
    <input
      id="input"
      class="flex-1 border rounded px-3 py-2"
      placeholder="Ask something about your mail…"
    />
    <button
      onclick="send()"
      class="bg-black text-white px-4 py-2 rounded"
    >
      Send
    </button>
  </footer>

<script>
const API_URL = "https://tahha-starthub-agent.onrender.com/chat";

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = role === "user"
    ? "text-right"
    : "text-left";

  div.innerHTML = `
    <div class="inline-block px-4 py-2 rounded ${
      role === "user"
        ? "bg-black text-white"
        : "bg-white border"
    }">
      ${text}
    </div>
  `;
  document.getElementById("chat").appendChild(div);
  div.scrollIntoView({ behavior: "smooth" });
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  addMessage("user", text);
  input.value = "";

  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();
  addMessage("agent", data.reply);
}
</script>

</body>
</html>
