<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Morgan – Secure SOP Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }

    body {
      background: linear-gradient(145deg, #0a0e1a 0%, #111827 40%, #0f172a 100%);
    }

    /* Glassmorphism */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Chat scrollbar */
    #chatCanvas::-webkit-scrollbar { width: 5px; }
    #chatCanvas::-webkit-scrollbar-track { background: transparent; }
    #chatCanvas::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 3px; }

    /* User bubble */
    .bubble-user {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 20px 20px 4px 20px;
    }

    /* Agent bubble */
    .bubble-agent {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px 20px 20px 4px;
    }

    /* Pulsating status dot */
    @keyframes pulse-live {
      0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5); }
      50% { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
    }
    .pulse-dot { animation: pulse-live 2s ease-in-out infinite; }

    /* Fade-in for chat messages */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeSlideUp 0.3s ease-out forwards; }

    /* Animated gradient line */
    .accent-line {
      background: linear-gradient(90deg, #4f46e5, #7c3aed, #ec4899, #4f46e5);
      background-size: 300% 100%;
      animation: shimmer 4s linear infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* Typing dots */
    .typing-dot { animation: typingBounce 1.4s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typingBounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* Login input focus glow */
    .login-input:focus {
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.4);
    }

    /* Smooth dashboard reveal */
    #dashboard {
      transition: opacity 0.5s ease-in-out;
    }
  </style>
</head>

<body class="text-white min-h-screen flex flex-col">

  <!-- ================================================================
       1. LOGIN MODAL OVERLAY (covers full screen on page load)
       ================================================================ -->
  <div id="loginModal"
       class="fixed inset-0 z-50 flex items-center justify-center bg-black/80">

    <div class="glass-card w-full max-w-md mx-4 p-8 rounded-2xl shadow-2xl">

      <!-- Shield Icon -->
      <div class="flex justify-center mb-5">
        <div class="w-14 h-14 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center">
          <svg class="w-7 h-7 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
      </div>

      <h2 class="text-2xl font-bold text-center mb-1">Ask Morgan</h2>
      <p class="text-sm text-white/40 text-center mb-8">Security Gateway · Entitlement Verification</p>

      <!-- User Identity -->
      <div class="mb-4">
        <label for="loginUserId" class="block text-xs font-semibold text-white/50 uppercase tracking-wider mb-2">
          User Identity (User ID)
        </label>
        <input id="loginUserId"
               type="text"
               placeholder="e.g. user_elec_456"
               autocomplete="username"
               class="login-input w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-white/20 text-sm outline-none transition-all">
      </div>

      <!-- Secure Password -->
      <div class="mb-4">
        <label for="loginPassword" class="block text-xs font-semibold text-white/50 uppercase tracking-wider mb-2">
          Secure Password
        </label>
        <input id="loginPassword"
               type="password"
               placeholder="Enter your secure password"
               autocomplete="current-password"
               class="login-input w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-white/20 text-sm outline-none transition-all"
               onkeydown="if(event.key==='Enter'){event.preventDefault();executeLogin();}">
      </div>

      <!-- Error message (hidden by default) -->
      <div id="loginError"
           class="hidden mb-4 px-4 py-2 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
      </div>

      <!-- Verify Button -->
      <button id="loginBtn"
              onclick="executeLogin()"
              class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold text-sm transition-all duration-200 shadow-lg shadow-indigo-500/20 hover:shadow-indigo-500/40 active:scale-[0.98]">
        Verify Identity
      </button>

      <p class="text-center text-white/20 text-xs mt-6">
        Protected by Row-Level Security &middot; Entitlement-gated access
      </p>
    </div>
  </div>

  <!-- ================================================================
       2. APPLICATION DASHBOARD (opacity 0 until login succeeds)
       ================================================================ -->
  <div id="dashboard" class="flex flex-col flex-1 min-h-screen" style="opacity: 0; pointer-events: none;">

    <!-- Gradient accent line -->
    <div class="accent-line h-[2px] w-full flex-shrink-0"></div>

    <!-- -------- HEADER -------- -->
    <header class="flex items-center justify-between px-6 py-3.5 glass-card border-b border-white/5 flex-shrink-0">

      <!-- Left: Brand + Live status -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/25">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-sm font-bold leading-tight">Ask Morgan</h1>
          <div class="flex items-center gap-1.5 mt-0.5">
            <div class="w-2 h-2 rounded-full bg-emerald-400 pulse-dot"></div>
            <span class="text-emerald-400 text-[10px] font-medium uppercase tracking-wider">Secure Session Active</span>
          </div>
        </div>
      </div>

      <!-- Right: User info + Sign Out -->
      <div class="flex items-center gap-3">
        <!-- Authenticated user name -->
        <span id="headerUserName" class="text-sm font-medium text-white/70"></span>

        <!-- Role/Discipline badge -->
        <span id="headerRoleBadge"
              class="px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider">
        </span>

        <!-- Sign Out -->
        <button onclick="triggerLogout()"
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 hover:bg-red-500/10 hover:border-red-500/30 transition-all text-xs text-white/50 hover:text-red-400">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          Sign Out
        </button>
      </div>
    </header>

    <!-- -------- CHAT CANVAS (scrollable workspace) -------- -->
    <main id="chatCanvas" class="flex-1 overflow-y-auto px-6 py-6 space-y-4">
      <!-- System welcome message (rendered by JS after login) -->
    </main>

    <!-- -------- BOTTOM INPUT PANEL -------- -->
    <footer class="flex-shrink-0 border-t border-white/5 px-5 py-4 glass-card">
      <div class="flex items-center gap-3 max-w-4xl mx-auto">
        <input id="msgInput"
               type="text"
               placeholder="Ask Morgan about your projects..."
               autocomplete="off"
               class="flex-1 px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-white/20 text-sm outline-none transition-all focus:border-indigo-500/50 focus:shadow-[0_0_0_3px_rgba(99,102,241,0.2)]"
               onkeydown="if(event.key==='Enter'){event.preventDefault();submitUserMessage();}">

        <button id="sendBtn"
                onclick="submitUserMessage()"
                class="w-11 h-11 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center flex-shrink-0 transition-all duration-200 hover:scale-105 active:scale-95 shadow-lg shadow-indigo-500/25 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:scale-100">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
        </button>
      </div>
      <p class="text-center text-white/15 text-[10px] mt-3 tracking-wide">
        Entitlement-filtered RAG &middot; Groq Llama 3.3 &middot; Row-Level Security enforced
      </p>
    </footer>
  </div>

  <!-- ================================================================
       3. JAVASCRIPT STATE ENGINE
       ================================================================ -->
  <script>
    // ---------------------------------------------------------------
    // Global auth state
    // ---------------------------------------------------------------
    let SESSION_TOKEN = null;   // user_id returned by /api/auth/login
    let SESSION_NAME  = null;
    let SESSION_ROLE  = null;

    // ---------------------------------------------------------------
    // DOM shortcuts
    // ---------------------------------------------------------------
    const $ = (id) => document.getElementById(id);

    // ---------------------------------------------------------------
    // Utility: escape HTML to prevent XSS
    // ---------------------------------------------------------------
    function esc(text) {
      const d = document.createElement('div');
      d.appendChild(document.createTextNode(text));
      return d.innerHTML;
    }

    // ---------------------------------------------------------------
    // Role → badge color map
    // ---------------------------------------------------------------
    function getRoleBadgeClasses(role) {
      const r = (role || '').toLowerCase();
      if (r === 'electrical') return 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30';
      if (r === 'plumbing')   return 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/30';
      if (r === 'gc_owner')   return 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
      if (r === 'admin')      return 'bg-amber-500/20 text-amber-300 border border-amber-500/30';
      return 'bg-gray-500/20 text-gray-300 border border-gray-500/30';
    }

    // ---------------------------------------------------------------
    // Add a chat bubble
    // ---------------------------------------------------------------
    function addBubble(text, sender) {
      const canvas = $('chatCanvas');
      const wrapper = document.createElement('div');
      wrapper.className = `fade-in flex ${sender === 'user' ? 'justify-end' : 'items-start gap-3'}`;

      const formatted = esc(text).replace(/\n/g, '<br>');

      if (sender === 'user') {
        wrapper.innerHTML = `
          <div class="bubble-user px-4 py-3 max-w-lg">
            <p class="text-white text-sm leading-relaxed">${formatted}</p>
          </div>`;
      } else {
        wrapper.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center flex-shrink-0 shadow-lg shadow-indigo-500/20">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
          </div>
          <div class="bubble-agent px-4 py-3 max-w-lg">
            <p class="text-white/90 text-sm leading-relaxed">${formatted}</p>
            <p class="text-white/20 text-[10px] mt-2">Verified · Entitlement-filtered response</p>
          </div>`;
      }

      canvas.appendChild(wrapper);
      canvas.scrollTop = canvas.scrollHeight;
    }

    // ---------------------------------------------------------------
    // Typing indicator
    // ---------------------------------------------------------------
    function showTyping() {
      const canvas = $('chatCanvas');
      const el = document.createElement('div');
      el.id = 'typingIndicator';
      el.className = 'fade-in flex items-start gap-3';
      el.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center flex-shrink-0 shadow-lg shadow-indigo-500/20">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
        </div>
        <div class="bubble-agent px-4 py-3">
          <div class="flex items-center gap-2">
            <div class="typing-dot w-2 h-2 rounded-full bg-indigo-400"></div>
            <div class="typing-dot w-2 h-2 rounded-full bg-indigo-400"></div>
            <div class="typing-dot w-2 h-2 rounded-full bg-indigo-400"></div>
            <span class="text-white/30 text-xs ml-1">Morgan is resolving access...</span>
          </div>
        </div>`;
      canvas.appendChild(el);
      canvas.scrollTop = canvas.scrollHeight;
    }

    function hideTyping() {
      const el = $('typingIndicator');
      if (el) el.remove();
    }

    // ---------------------------------------------------------------
    // Toggle send button state
    // ---------------------------------------------------------------
    function setSendState(disabled) {
      $('sendBtn').disabled = disabled;
      $('msgInput').disabled = disabled;
    }

    // ---------------------------------------------------------------
    // 1. executeLogin()
    // ---------------------------------------------------------------
    async function executeLogin() {
      // Clear previous error
      const errBox = $('loginError');
      errBox.classList.add('hidden');
      errBox.textContent = '';

      const userId   = $('loginUserId').value.trim();
      const password = $('loginPassword').value;

      if (!userId || !password) {
        errBox.textContent = 'Both fields are required.';
        errBox.classList.remove('hidden');
        return;
      }

      // Disable button during request
      $('loginBtn').disabled = true;
      $('loginBtn').textContent = 'Verifying...';

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: userId, password: password })
        });

        if (!resp.ok) {
          const data = await resp.json().catch(() => ({}));
          throw new Error(data.detail || 'Invalid corporate credentials');
        }

        const data = await resp.json();

        // Save session state
        SESSION_TOKEN = data.token;           // user_id
        SESSION_NAME  = data.name  || data.user_name || userId;
        SESSION_ROLE  = data.role  || data.user_role || 'Unknown';

        // Populate header
        $('headerUserName').textContent = SESSION_NAME;
        const badge = $('headerRoleBadge');
        badge.textContent = SESSION_ROLE.toUpperCase();
        badge.className = `px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider ${getRoleBadgeClasses(SESSION_ROLE)}`;

        // Hide login modal, reveal dashboard
        $('loginModal').style.display = 'none';
        const dash = $('dashboard');
        dash.style.opacity = '1';
        dash.style.pointerEvents = 'auto';

        // Welcome message
        addBubble(
          `Session authenticated. Welcome, ${SESSION_NAME}.\n` +
          `Your active discipline is "${SESSION_ROLE}". ` +
          `All responses are strictly filtered to your entitlement boundary.\n` +
          `Ask me anything about your authorized projects.`,
          'agent'
        );

        $('msgInput').focus();

      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('hidden');
      } finally {
        $('loginBtn').disabled = false;
        $('loginBtn').textContent = 'Verify Identity';
      }
    }

    // ---------------------------------------------------------------
    // 2. triggerLogout()
    // ---------------------------------------------------------------
    function triggerLogout() {
      SESSION_TOKEN = null;
      SESSION_NAME  = null;
      SESSION_ROLE  = null;

      // Reset UI
      $('chatCanvas').innerHTML = '';
      $('loginUserId').value = '';
      $('loginPassword').value = '';
      $('headerUserName').textContent = '';
      $('headerRoleBadge').textContent = '';

      // Show login modal, hide dashboard
      $('loginModal').style.display = 'flex';
      $('dashboard').style.opacity = '0';
      $('dashboard').style.pointerEvents = 'none';

      $('loginUserId').focus();
    }

    // ---------------------------------------------------------------
    // 3. submitUserMessage()
    // ---------------------------------------------------------------
    async function submitUserMessage() {
      const input = $('msgInput');
      const msg = input.value.trim();
      if (!msg || !SESSION_TOKEN) return;

      input.value = '';
      setSendState(true);

      // Render user bubble
      addBubble(msg, 'user');

      // Show typing indicator
      showTyping();

      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Acting-As': SESSION_TOKEN
          },
          body: JSON.stringify({ message: msg })
        });

        hideTyping();

        const data = await resp.json().catch(() => ({}));

        if (!resp.ok) {
          const errMsg = data.detail || `Server error (HTTP ${resp.status})`;
          addBubble(`⚠️ ${errMsg}`, 'agent');
        } else {
          const reply = data.reply || data.agent_message || 'No response received.';
          addBubble(reply, 'agent');
        }

      } catch (err) {
        hideTyping();
        addBubble(`⚠️ Connection error: ${err.message}`, 'agent');
      } finally {
        setSendState(false);
        $('msgInput').focus();
      }
    }

    // ---------------------------------------------------------------
    // Auto-focus on page load
    // ---------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      $('loginUserId').focus();
    });
  </script>
</body>
</html>
